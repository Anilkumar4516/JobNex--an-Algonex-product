<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <title> JobNex </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1> welcome to jobNex </h1>
        <p> Get ready to see your Resume fit for given Job description</p>
        <form id="analyze-Form">
            <label for="resume_text"> Give Resume</label>
            <textarea id="resume_text" placeholder="Upload your resume here" required></textarea>
            <label for="jd_text"> Job description</label>
            <textarea id="jd_text" placeholder="Passte your JD here..." required></textarea>

            <button type="Submit" id="analyze-button"> Analyze-Resume </button>
        </form>

        <p id='status' role='status'></p>

        <section id="results" hidden>
            <h2> Analyze Results</h2>
            <pre id="result-data"></pre>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
